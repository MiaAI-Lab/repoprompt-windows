[package]
name = "reprompt-windows"
version = "1.0.1"
description = "RepoPrompt for Windows - Context Engineering Tool for AI Coding Agents"
authors = ["Mia's AI Lab"]
license = "Apache-2.0"
repository = "https://github.com/MiaAI-Lab/reprompt-windows"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-log = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"

# Token counting
tiktoken-rs = "0.6"

# File system
walkdir = "2"
glob = "0.3"
ignore = "0.4"

# Git integration
git2 = "0.19"

# Regex
regex = "1"

# UUID
uuid = { version = "1", features = ["v4"] }

# Encoding detection
encoding_rs = "0.8"

# Async runtime for MCP server
tokio = { version = "1", features = ["full"] }

# Pin time to avoid cookie crate conflict
time = "=0.3.36"

